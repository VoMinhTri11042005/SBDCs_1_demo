services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sbdcs_backend_dev
    environment:
      DATABASE_PATH: /app/data/database.sqlite
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: sbdcs_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
