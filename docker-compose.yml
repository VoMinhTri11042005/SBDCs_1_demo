services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sbdcs_backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/database.sqlite
      EMAIL_MODE: ${EMAIL_MODE:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sbdcs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
